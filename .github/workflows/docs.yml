name: docs

# Build and publish the MkDocs Material site to GitHub Pages (gh-pages branch).
# Enable Pages with Source = gh-pages branch (Settings -> Pages).

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r website/requirements-docs.txt
      - run: mkdocs gh-deploy --force --config-file website/mkdocs.yml
